[workspace]
resolver = "3"
members = [
    "crates/thoth-mesh-core",
    "crates/thoth-mesh",
    "crates/thoth-mesh-broker",
    "crates/thoth-mesh-tls",
    "crates/thoth-mesh-node",
    "crates/thoth-mesh-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Keep in sync with .github/workflows/ci.yml's `msrv` job, which
# builds and tests against this exact version - nothing else catches
# it drifting stale again (see ADR-0023's context, and #90).
rust-version = "1.88"
authors = ["Bruno Arueira <contato@brunoarueira.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/brunoarueira/thoth-mesh"
homepage = "https://github.com/brunoarueira/thoth-mesh"

[profile.release]
lto = true
codegen-units = 1
