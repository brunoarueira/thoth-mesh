name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref (branch or PR) so pushes don't
# pile up queued/running jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job needs to write to the repo or use secrets; keep the default
# GITHUB_TOKEN read-only.
permissions:
  contents: read

jobs:
  test:
    name: build, test, fmt, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # main, post-v2.9.2 (untagged upstream commit, see PR #67)

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (all features)
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace --locked

      - name: Test (all features)
        run: cargo test --workspace --all-features --locked

  msrv:
    name: build, test (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds and tests against the workspace's declared rust-version
      # itself, not just whatever's newest - the `test` job above only
      # ever exercises the latest stable release, so it never actually
      # proved the declared floor still works. That's exactly how
      # rust-version drifted stale for a while before #90 caught it
      # (found by accident, building a Docker image pinned to it).
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # main, post-v2.9.2 (untagged upstream commit, see PR #67)

      - name: Build (all features)
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Test (all features)
        run: cargo test --workspace --all-features --locked
