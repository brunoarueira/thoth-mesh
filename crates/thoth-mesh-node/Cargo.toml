[package]
name = "thoth-mesh-node"
description = "Daemon that runs a thoth-mesh node: wires the federation layer to a network transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "thoth_mesh_node"
path = "src/lib.rs"

[[bin]]
name = "thoth-mesh-node"
path = "src/main.rs"

[dependencies]
thoth-mesh-core = { path = "../thoth-mesh-core", version = "0.0.1" }
thoth-mesh = { path = "../thoth-mesh", version = "0.0.1" }
thoth-mesh-broker = { path = "../thoth-mesh-broker", version = "0.0.1" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "test-util", "time"] }
