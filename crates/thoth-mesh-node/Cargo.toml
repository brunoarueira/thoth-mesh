[package]
name = "thoth-mesh-node"
description = "Daemon that runs a thoth-mesh node: wires the federation layer to a network transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "thoth_mesh_node"
path = "src/lib.rs"

[[bin]]
name = "thoth-mesh-node"
path = "src/main.rs"

[dependencies]
thoth-mesh-core = { path = "../thoth-mesh-core", version = "0.2.0", features = ["async"] }
thoth-mesh = { path = "../thoth-mesh", version = "0.2.0" }
thoth-mesh-broker = { path = "../thoth-mesh-broker", version = "0.2.0" }
thoth-mesh-tls = { path = "../thoth-mesh-tls", version = "0.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.19"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "test-util", "time"] }
