[package]
name = "thoth-mesh-cli"
description = "Command-line client for publishing, subscribing, and administering a thoth-mesh node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "thoth_mesh_cli"
path = "src/lib.rs"

[[bin]]
name = "thoth-mesh"
path = "src/main.rs"

[dependencies]
thoth-mesh-core = { path = "../thoth-mesh-core", version = "0.2.0", features = ["async"] }
thoth-mesh-tls = { path = "../thoth-mesh-tls", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "signal"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "1.1.5"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
clap_complete = "4.6.9"

[dev-dependencies]
thoth-mesh-node = { path = "../thoth-mesh-node", version = "0.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time"] }
