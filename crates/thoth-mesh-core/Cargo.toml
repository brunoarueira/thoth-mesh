[package]
name = "thoth-mesh-core"
description = "Core protocol types and wire format for the thoth-mesh federated pub/sub mesh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ciborium = "0.2.2"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "io"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[features]
async = ["dep:futures-util"]

[dev-dependencies]
futures-executor = "0.3.33"
