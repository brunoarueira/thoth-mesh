[package]
name = "thoth-mesh-tls"
description = "TLS transport helpers for the thoth-mesh federated pub/sub system: certificate loading, config, and a plaintext/TLS stream shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
thiserror = "2.0.19"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros"] }
