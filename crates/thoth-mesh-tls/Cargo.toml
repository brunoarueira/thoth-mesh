[package]
name = "thoth-mesh-tls"
description = "TLS transport helpers for the thoth-mesh federated pub/sub system: certificate loading, config, and a plaintext/TLS stream shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# ring is already pulled in transitively via rustls/tokio-rustls's
# "ring" feature below - declared directly too so this crate can use
# ring::digest for peer certificate fingerprinting (ADR-0017) without
# adding a new dependency to the build.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# PEM loading uses rustls-pki-types::pem::PemObject directly rather
# than rustls-pemfile - the latter is unmaintained as of late 2025
# (RUSTSEC-2025-0134) and is itself now a thin wrapper around this.
rustls-pki-types = { version = "1", features = ["std"] }
thiserror = "2.0.19"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros"] }
